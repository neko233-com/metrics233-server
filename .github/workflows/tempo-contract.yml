name: Tempo interoperability
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tempo-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-tempo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: go vet -tags=integration,webui ./tests/integration && go test ./internal/server -run '^TestTempoTrace' -count=1
      - name: Cold-daemon and repeated actual browser checks
        env:
          METRICSPANEL_TEMPO_BROWSER_TEST: '1'
        run: go test -tags=integration,webui ./tests/integration -run '^TestTempoLiveDataSource$' -count=2 -v -timeout=6m
