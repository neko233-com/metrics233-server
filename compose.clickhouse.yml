# Optional high-volume backend. Combine with compose.yml explicitly.
services:
  metricspanel:
    environment:
      METRICSPANEL_STORAGE: clickhouse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: metricspanel
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
    depends_on:
      clickhouse:
        condition: service_healthy
  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    environment:
      CLICKHOUSE_USER: metricspanel
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: ["metrics:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  metrics:
