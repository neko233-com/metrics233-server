name: metricspanel233
services:
  metricspanel:
    build: .
    image: metricspanel233:local
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    ports: ["127.0.0.1:7333:7333"]
    environment:
      METRICSPANEL_TOKEN: ${METRICSPANEL_TOKEN:?Set METRICSPANEL_TOKEN with at least 16 characters}
      METRICSPANEL_AUTH: ${METRICSPANEL_AUTH:-token}
      METRICSPANEL_ADMIN_USER: ${METRICSPANEL_ADMIN_USER:-}
      METRICSPANEL_ADMIN_PASSWORD: ${METRICSPANEL_ADMIN_PASSWORD:-}
      METRICSPANEL_ADMIN_EMAIL: ${METRICSPANEL_ADMIN_EMAIL:-}
      METRICSPANEL_ROOT_URL: ${METRICSPANEL_ROOT_URL:-http://127.0.0.1:7333}
      METRICSPANEL_TRUSTED_PROXIES: ${METRICSPANEL_TRUSTED_PROXIES:-}
      METRICSPANEL_STORAGE: ${METRICSPANEL_STORAGE:-embedded}
    volumes: ["control:/data"]
    restart: unless-stopped
volumes:
  control:
